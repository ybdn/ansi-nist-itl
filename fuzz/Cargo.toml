[package]
name = "ansi-nist-itl-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ansi-nist-itl = { path = ".." }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exact"
path = "fuzz_targets/exact.rs"
test = false
doc = false
bench = false

# Kept out of the workspace of the crate.
[workspace]
members = ["."]
