[package]
name = "ansi-nist-itl-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ansi-nist-itl = { path = "..", features = ["validation", "serde"] }
serde_json = "1.0"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exact"
path = "fuzz_targets/exact.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_tolerant"
path = "fuzz_targets/parse_tolerant.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encoding"
path = "fuzz_targets/encoding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serde"
path = "fuzz_targets/serde.rs"
test = false
doc = false
bench = false

# Kept out of the workspace of the crate.
[workspace]
members = ["."]
