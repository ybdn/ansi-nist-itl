name: Release

# Publishes to crates.io through Trusted Publishing (OIDC, no stored token) when a `v*` tag
# is pushed on `prod`. A manual run does every check and `cargo publish --dry-run`, and
# never publishes: publishing is irreversible and only a tag on prod may do it.
# Prerequisite: the trusted publisher (this repository, this workflow) declared on crates.io.
# Safe to re-run: a version already on crates.io is not published again, and an existing
# GitHub release is kept.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify tag, version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/prod; then
              echo "::error::tag $REF_NAME is not on prod"
              exit 1
            fi
          fi
          # Keep a Changelog headings: "## [1.0.1] - 2026-11-02"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            if [ "$DRY_RUN" = true ]; then
              echo "::warning::CHANGELOG.md has no '## [$version]' section (ignored in a dry run)"
              exit 0
            fi
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

  ci:
    name: checks
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read # ci.yml's `changes` job asks for it; a called workflow cannot exceed its caller

  publish:
    name: publish
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub release
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Dry run
        if: github.event_name != 'push'
        run: cargo publish --dry-run
      - name: Already on crates.io?
        if: github.event_name == 'push'
        id: published
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -A "ansi-nist-itl release workflow" \
            "https://crates.io/api/v1/crates/ansi-nist-itl/$VERSION")
          case "$status" in
            200) echo "::notice::$VERSION is already on crates.io: not published again"
                 echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io answered $status"; exit 1 ;;
          esac
      - name: Authenticate to crates.io
        if: github.event_name == 'push' && steps.published.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        if: github.event_name == 'push' && steps.published.outputs.published == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
